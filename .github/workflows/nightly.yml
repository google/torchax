name: Nightly Publish to PyPI

on:
  schedule:
    # Runs at 10:00 AM UTC every day == 2am PST
    - cron: '0 10 * * *'
  # Allows you to click "Run workflow" manually in GitHub UI for testing
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      # IMPORTANT: Required for PyPI Trusted Publishing (passwordless)
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: pip install build

      - name: Patch version for Nightly
        run: |
          python scripts/update_to_nightly_version.py

          # Verify the change (Debugging)
          grep "__version__" torchax/__init__.py

      - name: Build Wheel and Sdist
        run: |
          pip install twine
          python -m build --wheel

      - name: Authenticate to Google Cloud (OSS Exit Gate)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f

      - name: Stage to OSS Exit Gate and upload manifest
        run: |
          python -m twine upload \
            --repository-url "https://us-python.pkg.dev/oss-exit-gate-prod/torchax--pypi/" \
            -u oauth2accesstoken \
            -p "$(gcloud auth print-access-token)" \
            dist/*
          echo '{"publish_all": true}' > manifest.json
          gcloud storage cp manifest.json \
            "gs://oss-exit-gate-prod-projects-bucket/torchax/pypi/manifests/manifest-${{ github.run_id }}-${{ github.run_attempt }}.json"
